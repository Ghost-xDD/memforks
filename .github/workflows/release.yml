name: Release

# Triggers on any tag matching v* (e.g. v0.1.21, v0.2.0).
# Runs the unit test suite first, then publishes all four npm packages
# (@memfork/core, @memfork/cli, @memfork/langgraph, @memfork/vercel-ai)
# and creates / updates the GitHub release.
on:
  push:
    tags:
      - "v*"

jobs:
  # ── Gate: unit tests must pass before anything is published ──────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root workspace deps
        run: npm install --ignore-scripts

      - name: Install core deps
        run: npm install
        working-directory: packages/core

      - name: Build core (tests import from dist)
        run: npm run build
        working-directory: packages/core

      - name: Install CLI deps
        run: npm install
        working-directory: packages/cli

      - name: Install visualizer deps (required by CLI bundle-ui step)
        run: npm install
        working-directory: apps/visualizer

      - name: Build CLI (tests import from @memfork/cli/dist/)
        run: npm run build
        working-directory: packages/cli

      - name: Run unit tests
        run: npm run test:unit
        working-directory: tests/cli

  # ── Publish all packages to npm ───────────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write   # needed to create / update the GitHub release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Root install creates the workspace symlinks under node_modules/@memfork/*
      # that tsc relies on to resolve cross-package imports (e.g. vercel-ai's
      # dynamic import of @memfork/cli).
      - name: Install root workspace deps
        run: npm install --ignore-scripts

      - name: Install visualizer deps (needed for CLI bundle-ui step)
        run: npm install
        working-directory: apps/visualizer

      # ── Build in dependency order ─────────────────────────────────────────────
      # core → cli → langgraph → vercel-ai. cli MUST build before vercel-ai
      # because vercel-ai imports @memfork/cli and tsc needs cli's emitted
      # dist/index.d.ts to typecheck.
      - name: Build @memfork/core
        run: npm run build
        working-directory: packages/core

      - name: Build @memfork/cli (copies plugins + tsc + bundles visualizer)
        run: npm run build
        working-directory: packages/cli

      - name: Build @memfork/langgraph
        run: npm run build
        working-directory: packages/langgraph

      - name: Build @memfork/vercel-ai
        run: npm run build
        working-directory: packages/vercel-ai

      # ── Publish to npm (core first so consumers resolve its version) ──────────
      # `grep -v "cannot publish over"` makes a re-published (unchanged) version
      # a no-op instead of a failure.
      - name: Publish @memfork/core
        run: npm publish --access public 2>&1 | grep -v "cannot publish over" || true
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @memfork/langgraph
        run: npm publish --access public 2>&1 | grep -v "cannot publish over" || true
        working-directory: packages/langgraph
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @memfork/vercel-ai
        run: npm publish --access public 2>&1 | grep -v "cannot publish over" || true
        working-directory: packages/vercel-ai
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @memfork/cli
        run: npm publish --access public 2>&1 | grep -v "cannot publish over" || true
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Annotate the GitHub release ──────────────────────────────────────────
      - name: Get package versions
        id: versions
        run: |
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          LG=$(node -p "require('./packages/langgraph/package.json').version")
          VAI=$(node -p "require('./packages/vercel-ai/package.json').version")
          echo "core=$CORE"       >> $GITHUB_OUTPUT
          echo "cli=$CLI"         >> $GITHUB_OUTPUT
          echo "langgraph=$LG"    >> $GITHUB_OUTPUT
          echo "vercel_ai=$VAI"   >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          CORE="${{ steps.versions.outputs.core }}"
          CLI="${{ steps.versions.outputs.cli }}"
          LG="${{ steps.versions.outputs.langgraph }}"
          VAI="${{ steps.versions.outputs.vercel_ai }}"
          FOOTER=$(printf -- '---\n\n**npm packages**\n\n| Package | Version |\n|---|---|\n| [`@memfork/core`](https://www.npmjs.com/package/@memfork/core) | `%s` |\n| [`@memfork/cli`](https://www.npmjs.com/package/@memfork/cli) | `%s` |\n| [`@memfork/langgraph`](https://www.npmjs.com/package/@memfork/langgraph) | `%s` |\n| [`@memfork/vercel-ai`](https://www.npmjs.com/package/@memfork/vercel-ai) | `%s` |\n\n```bash\nnpm install -g @memfork/cli@latest\n```' "$CORE" "$CLI" "$LG" "$VAI")
          if gh release view "$TAG" > /dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --json body -q .body)
            gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$EXISTING" "$FOOTER")"
          else
            gh release create "$TAG" --title "$TAG" --notes "$FOOTER"
          fi
